# 部署清单：KubeStack Console
# 通过 deploy/install.sh 在目标集群上安装；管理员密码等凭据仅通过 Secret 环境变量注入。
apiVersion: v1
kind: Namespace
metadata:
  name: kubestack-system
  labels:
    app.kubernetes.io/name: kubestack-console
---
# 平台需要读写全集群资源（对标 KubeSphere 的管理范围）。
# 组件本身不落盘任何凭据：Pod 内通过 ServiceAccount 自动挂载的 token 访问 API Server。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubestack-console
  namespace: kubestack-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubestack-console-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kubestack-console
    namespace: kubestack-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubestack-console
  namespace: kubestack-system
  labels:
    app.kubernetes.io/name: kubestack-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubestack-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubestack-console
    spec:
      serviceAccountName: kubestack-console
      containers:
        - name: console
          image: kubestack-console:latest
          imagePullPolicy: Never   # 镜像由 install.sh 构建并导入本节点 containerd
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            # 可选：启用登录鉴权。值由 install.sh 从环境变量 ADMIN_PASSWORD 写入，
            # 仓库中不存在任何真实凭据。
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubestack-console-config
                  key: admin-password
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubestack-console
  namespace: kubestack-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kubestack-console
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30885
